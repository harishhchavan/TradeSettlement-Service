plugins {
    // Apply the scala Plugin to add support for Scala.
    id 'scala'

    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use Scala 2.13 in our library project
    implementation libs.scala.library

    // This dependency is used by the application.
    implementation libs.guava

    // Use Scalatest for testing our library
//    testImplementation libs.junit
//    testImplementation libs.junit.v4.v13.v2.v13
    testImplementation libs.scalatest.v2.v13

    // Need scala-xml at test runtime
    testRuntimeOnly libs.scala.xml.v2.v13

    // Config
    implementation "com.typesafe:config:1.4.3"

    // Play JSON (stable)
    implementation "com.typesafe.play:play-json_2.13:2.10.4"

    // Akka HTTP + Streams
    implementation "com.typesafe.akka:akka-http_2.13:10.5.3"
    implementation "com.typesafe.akka:akka-stream_2.13:2.6.21"

    // Logging
    implementation "org.slf4j:slf4j-api:2.0.13"
    implementation "ch.qos.logback:logback-classic:1.5.6"

    // Database: Microsoft SQL Server JDBC
    implementation "com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11"

    //From Maven Central:
    implementation "com.crankuptheamps:amps-client:5.3.5.0"

    // Cucumber (Java Annotations)
    testImplementation "io.cucumber:cucumber-java:7.26.0"

    //Cucumber (ScalaDsl)
    testImplementation "io.cucumber:cucumber-scala_2.13:8.20.0"

    //To run without creating extra TestRunner class (Applicable only after JUnit 5)
    testImplementation "io.cucumber:cucumber-junit-platform-engine:7.26.0"

    // JUnit 5
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.1"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.1"

}

test{
    useJUnitPlatform()
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.trade.settlementService.SettlementService'
}
